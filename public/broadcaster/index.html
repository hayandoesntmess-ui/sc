<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcaster</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  /* Intentionally blank UI — actor sees nothing but their own camera preview
     (useful for framing) and a tiny status dot, nothing resembling the platform. */
  #preview { width: 100%; height: 100%; object-fit: cover; background: #000; }
  #status {
    position: fixed; top: 10px; left: 10px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #444; transition: background 0.3s;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
  }
  #status.live { background: #2ecc71; }
  #status.error { background: #e74c3c; }
</style>
</head>
<body>
  <video id="preview" autoplay playsinline muted></video>
  <div id="status"></div>

  <script>
    const statusDot = document.getElementById('status');
    const preview = document.getElementById('preview');
    let pc = null;
    let sessionId = null;
    let iceReadCursor = 0;

    function setStatus(cls) {
      statusDot.className = cls;
    }

    async function postJSON(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      return res.json();
    }
    async function getJSON(url) {
      const res = await fetch(url);
      return res.json();
    }

    async function start() {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true,
        });
      } catch (err) {
        setStatus('error');
        console.error('Camera/mic error:', err);
        return;
      }
      preview.srcObject = stream;

      pc = new RTCPeerConnection({ iceServers: [] }); // LAN only, no STUN needed
      stream.getTracks().forEach((track) => pc.addTrack(track, stream));

      pc.onicecandidate = (event) => {
        if (event.candidate && sessionId != null) {
          postJSON('/api/signal/ice', { from: 'broadcaster', candidate: event.candidate, sessionId });
        }
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') setStatus('live');
        else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') setStatus('error');
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const res = await postJSON('/api/signal/offer', { sdp: offer.sdp, type: offer.type });
      sessionId = res.sessionId;

      pollForAnswer();
      pollForViewerIce();
    }

    async function pollForAnswer() {
      while (!pc.currentRemoteDescription) {
        try {
          const res = await getJSON('/api/signal/answer?sessionId=' + sessionId);
          if (res.answer) {
            await pc.setRemoteDescription(new RTCSessionDescription(res.answer));
            break;
          }
        } catch (e) {}
        await new Promise((r) => setTimeout(r, 700));
      }
    }

    async function pollForViewerIce() {
      while (true) {
        try {
          const res = await getJSON(`/api/signal/ice?from=viewer&since=${iceReadCursor}&sessionId=${sessionId}`);
          if (res.sessionId !== sessionId) return; // session reset, stop
          for (const c of res.candidates) {
            try { await pc.addIceCandidate(c); } catch (e) {}
          }
          iceReadCursor += res.candidates.length;
        } catch (e) {}
        await new Promise((r) => setTimeout(r, 700));
      }
    }

    start();
  </script>
</body>
</html>
