<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>ScienceCare — Production Panel</title>
  <link rel="icon" href="assets/logo.jpg">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.jpg" alt="ScienceCare logo" class="brand-logo">
        <div>
          <h1>ScienceCare Production</h1>
          <span class="brand-sub">Filming control panel</span>
        </div>
      </div>
      <div class="status-cluster">
        <span id="rtMode" class="pill pill-neutral">connecting...</span>
        <span id="viewerStatus" class="pill pill-neutral">viewer offline</span>
      </div>
    </header>

    <section class="card card-class">
      <h2>Class</h2>
      <label class="field">
        <span>Class title</span>
        <input id="classTitle" type="text" autocomplete="off">
      </label>
      <label class="field">
        <span>YouTube embed URL or channel ID</span>
        <input id="youtubeUrl" type="text" autocomplete="off"
          placeholder="https://www.youtube.com/embed/live_stream?channel=CHANNEL_ID or CHANNEL_ID">
      </label>
      <label class="field field-inline">
        <span>Live viewer count (0 = hidden)</span>
        <input id="viewerCount" type="number" min="0" step="10">
      </label>
      <div class="btn-row">
        <button id="startBtn" class="btn btn-primary">Start comments</button>
        <button id="pauseBtn" class="btn">Pause</button>
        <button id="clearBtn" class="btn btn-danger">Clear chat</button>
      </div>
    </section>

    <section class="card">
      <h2>Comments</h2>
      <label class="field field-inline">
        <span>Frequency (per minute)</span>
        <input id="commentRate" type="range" min="1" max="60" step="1">
        <output id="commentRateOut" class="out"></output>
      </label>
      <div id="categoryToggles" class="toggle-grid"></div>
      <div id="weightGrid" class="weight-grid"></div>
    </section>

    <section class="card">
      <h2>Reactions</h2>
      <label class="field field-inline">
        <span>Reaction frequency (per minute)</span>
        <input id="reactionRate" type="range" min="0" max="30" step="1">
        <output id="reactionRateOut" class="out"></output>
      </label>
      <div id="emojiToggles" class="toggle-grid"></div>
    </section>

    <section class="card">
      <h2>Scenes</h2>
      <label class="field">
        <span>Active scene (adds a scene comment pool)</span>
        <select id="sceneSelect"></select>
      </label>
    </section>

    <section class="card">
      <h2>Manual triggers</h2>
      <div class="manual-row">
        <label class="field grow">
          <span>Comment text (optional)</span>
          <input id="manualText" type="text" placeholder="Custom comment or leave empty for random">
        </label>
        <label class="field">
          <span>Category</span>
          <select id="manualCategory"></select>
        </label>
        <button id="sendCommentBtn" class="btn btn-primary self-end">Send comment</button>
      </div>
      <div class="btn-row">
        <button id="burstBtn" class="btn">Reaction burst</button>
        <label class="field field-inline grow">
          <span>Pin a highlighted comment</span>
          <select id="pinSelect"></select>
        </label>
        <button id="pinBtn" class="btn self-end">Pin</button>
        <button id="unpinBtn" class="btn self-end">Unpin</button>
      </div>
    </section>

    <section class="card">
      <h2>Live feed (what the viewer is showing)</h2>
      <div id="feed" class="feed" aria-live="polite">
        <p class="feed-empty">No activity yet.</p>
      </div>
    </section>

  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
