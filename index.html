<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo.jpg">
  <link rel="apple-touch-icon" href="assets/logo.jpg">
  <title>ScienceCare Academic Aid</title>
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
  <div id="app">

    <header class="appbar">
      <img class="appbar-logo" src="assets/logo.jpg" alt="ScienceCare logo">
      <div class="appbar-titles">
        <h1 id="classTitle">ScienceCare Academic Aid</h1>
        <span class="appbar-sub">Live Class</span>
      </div>
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    </header>

    <main class="content">

      <section class="video-section">
        <div id="videoStage" class="video-stage">
          <div id="videoHolder"></div>
          <div id="videoPlaceholder" class="video-placeholder">
            <img src="assets/logo.jpg" alt="ScienceCare logo">
            <p>Waiting for the stream link...</p>
          </div>
          <div id="reactionLayer" class="reaction-layer" aria-hidden="true"></div>
        </div>

        <div class="video-meta">
          <div class="meta-left">
            <span id="viewerCount" class="viewer-count hidden"></span>
            <span id="likeCount" class="like-count">&#10084;&#65039; 0</span>
          </div>
          <button id="likeBtn" class="like-btn" aria-label="Send a like">&#128077;</button>
        </div>
      </section>

      <section id="pinnedBar" class="pinned-bar hidden" aria-live="polite">
        <div class="pin-head"><span class="pin-emoji">&#128204;</span> Pinned</div>
        <div class="pin-body">
          <span id="pinName" class="pin-name"></span>
          <span id="pinText" class="pin-text"></span>
        </div>
        <span id="pinLikes" class="pin-likes"></span>
      </section>

      <section class="chat-section">
        <div class="chat-head">
          <h2>Live Comments</h2>
          <span id="chatStatus" class="chat-status">Waiting for class to start...</span>
        </div>
        <div id="chatList" class="chat-list" role="log" aria-live="polite"></div>
      </section>

    </main>

    <footer class="bottom-bar">
      <button id="bottomLike" class="bottom-action" aria-label="Like this class">
        <span class="bottom-icon">&#10084;&#65039;</span>
        <span id="bottomLikeCount">0</span>
      </button>
      <span class="bottom-note">ScienceCare Academic Aid</span>
    </footer>

  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/viewer.js"></script>
</body>
</html>
